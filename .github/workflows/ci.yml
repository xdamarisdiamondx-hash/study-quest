name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Free for public repositories (ADR-024 / P0).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The web build is what ships to a phone as a PWA, so a broken build fails CI.
      - name: Build
        run: pnpm --filter @sq/web build

      # The database-backed services are checked against the same schema the app
      # generates, using a throwaway Postgres service container (ADR-013).
      - name: Migration check
        run: pnpm db:generate && git diff --exit-code packages/db/migrations

  migrations:
    name: Schema applies cleanly
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: studyquest
          POSTGRES_USER: studyquest
          POSTGRES_PASSWORD: studyquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyquest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to a real PostgreSQL
        env:
          DATABASE_URL: postgresql://studyquest:studyquest@127.0.0.1:5432/studyquest
        run: node apps/server/src/migrate-check.ts
