[build]
  command = "pnpm install && pnpm --filter @sq/web build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@neondatabase/serverless", "better-auth", "drizzle-orm", "hono", "zod"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200