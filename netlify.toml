[build]
  command = "pnpm install && pnpm --filter @sq/web build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/api/**/*", "netlify/functions/test/**/*"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/test/*"
  to = "/.netlify/functions/test/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200