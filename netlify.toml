[build]
  command = "pnpm install && pnpm --filter @sq/web build"
  publish = "dist"
  functions = "netlify/functions"
  base = "apps/web"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200